services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_KEY: ${APP_KEY:?Defina APP_KEY no arquivo .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      GOOGLE_CHAT_ENABLED: ${GOOGLE_CHAT_ENABLED:-false}
      GOOGLE_CHAT_WEBHOOK_URL: ${GOOGLE_CHAT_WEBHOOK_URL:-}
    volumes:
      - deploy_data:/data
    restart: unless-stopped
volumes:
  deploy_data:
